<div class="container mt-5">
    <div class="row">
        <!-- Right Column: Cart Summary -->
        <div class="col-md-5 order-1 order-md-2 mb-4">
            <h2 class="mb-4">Order Summary</h2>
            <div class="card">
                <div class="card-body">
                    <div *ngFor="let item of cartItems">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h5 class="mb-0">{{ item.product.name }}</h5>
                                <small>Quantity: {{ item.quantity }}</small>
                            </div>
                            <span class="text-muted">&euro;{{ item.product.price * item.quantity }}</span>
                        </div>
                        <hr />
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <h5>Total</h5>
                        <h5>&euro;{{ calculateCartTotal() }}</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Column: Checkout Form -->
        <div class="col-md-7 order-2 order-md-1">
            <h2 class="mb-4">Checkout</h2>

            <!-- Form tag with ngModelGroup to track validation state -->
            <form (submit)="handleSubmit($event)">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Enter First Name"
                        [(ngModel)]="firstName" name="firstName" required #firstNameField="ngModel" />
                    <div *ngIf="firstNameField.invalid && firstNameField.touched" class="text-danger">
                        First Name is required.
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Enter Last Name"
                        [(ngModel)]="lastName" name="lastName" required #lastNameField="ngModel" />
                    <div *ngIf="lastNameField.invalid && lastNameField.touched" class="text-danger">
                        Last Name is required.
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter Email" [(ngModel)]="email"
                        name="email" required email #emailField="ngModel" />
                    <div *ngIf="emailField.invalid && emailField.touched" class="text-danger">
                        Valid Email is required.
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter Email" [(ngModel)]="email"
                        name="email" required email #emailField="ngModel" />
                    <div *ngIf="emailField.invalid && emailField.touched" class="text-danger">
                        Valid Email is required.
                    </div>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="tel" class="form-control" id="city" placeholder="Enter City"
                        [(ngModel)]="city" name="city" required #cityField="ngModel" />
                    <div *ngIf="cityField.invalid && cityField.touched" class="text-danger">
                        Please enter city
                    </div>
                </div>

                <!-- Disable button if form is invalid -->
                <div id="card-element"></div> <!-- Placeholder for Stripe Card Element -->
                <button type="submit">Pay</button>
            </form>
        </div>
    </div>
</div>

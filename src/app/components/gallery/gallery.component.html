<div class="media-gallery">
    <div *ngFor="let item of mediaItems" class="media-item">
        <ng-container *ngIf="item.media_type === 'IMAGE'; else videoTemplate">
            <img [src]="item.media_url" [alt]="item.caption" />
        </ng-container>
        <ng-template #videoTemplate>
            <video controls>
                <source [src]="item.media_url" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </ng-template>
        <p>{{ item.caption }}</p>
    </div>

    <div class="video-gallery">
        <h2 class="ml-3">Video Gallery</h2>

        <div class="year-toggle">
            <div class="toggle-buttons">
                <button *ngFor="let year of years" [class.selected]="year === selectedYear"
                    (click)="onYearToggle(year)">
                    {{ year }}
                </button>
            </div>
        </div>

        <div class="video-list">
            <div *ngFor="let video of paginatedVideos" class="video-item">
                <a [href]="'https://www.youtube.com/watch?v=' + video.videoId" target="_blank">
                    <img [src]="video.thumbnail" [alt]="video.title" />
                    <h3 [innerHTML]="video.title"></h3>
                </a>
            </div>
        </div>
        <div class="d-flex mt-2  justify-content-center">
            <div class="d-flex mt-2">
                <button (click)="loadMore()" *ngIf="paginatedVideos.length < videos.length" id="load-more">Load More</button>
            </div>
        </div>
    </div>

</div>
